[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "conventional-commits-check>=2.9.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langchain-postgres>=0.0.19",
    "langchain-pymupdf4llm>=1.28.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pre-commit>=4.6.2",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.uv.build-backend]
module-name = "agent"

[project.scripts]
agent = "agent:main:main"

