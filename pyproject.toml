[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "conventional-commits-check>=2.9.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langchain-postgres>=0.0.19",
    "langgraph>=1.2.14",
    "pre-commit>=4.6.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
workspace = "workspace:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
