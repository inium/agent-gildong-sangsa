_type: prompt
template: |
  길동상사의 쇼핑몰 CS 실무 매뉴얼에 따른 주문, 결제, 배송, 취소, 교환,
  반품, 환불 및 고객 불만 응대 절차에 관한 질문에 사용합니다.
  문의 내용과 함께 사용자가 제공한 주문·배송 상태 등 처리 조건 판단에 필요한 정보를 전달하세요.
  내부 에이전트가 매뉴얼을 검색하여 처리 조건과 절차에 대한 근거 기반 답변을 생성합니다.
  답변은 content로, 검색된 원본 문서 목록은 artifact로 반환합니다.
  근거가 부족하면 확인할 수 없다고 안내합니다.
  실제 주문 조회나 변경, 취소, 교환, 반품, 환불 또는 보상 지급은 수행하지 않습니다.
