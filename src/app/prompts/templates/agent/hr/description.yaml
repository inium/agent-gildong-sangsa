_type: prompt
template: |
  길동상사의 취업규칙·출장여비·복리후생 규정에 관한 질문에 사용합니다.
  질문과 함께 사용자가 제공한 근무 조건, 출장 조건 등 판단에 필요한 정보를 전달하세요.
  출장비 산출 등 계산 요청도 이 도구에 전달하세요. 세부 조건이 부족해도 현재 질문과 제공된 조건으로 먼저 호출하여 규정의 지급 기준을 확인합니다.
  내부 에이전트가 관련 규정을 검색하여 근거에 따른 답변을 생성하고, 계산에 필요한 누락 정보를 확인합니다.
  검색된 원본 문서는 artifact로 반환합니다.
  실제 인사 처리나 지원금 지급은 수행하지 않습니다.
